name: Sync Upstream & Build

on:
  schedule:
    - cron: '0 4,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git 2>/dev/null || true
          git remote set-url upstream https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git
          git fetch upstream master

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No updates (local: ${LOCAL:0:7} already contains upstream: ${REMOTE:0:7})"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates available: ${LOCAL:0:7} -> upstream ${REMOTE:0:7}"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge --no-edit upstream/master || {
            echo "::error::Merge conflict, needs manual resolution"
            git diff --name-only --diff-filter=U
            exit 1
          }

      - name: Push to dev
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin dev

      - name: Trigger build
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-firmware.yml',
              ref: 'dev'
            })
            console.log('Build workflow triggered')

      - name: Summary
        if: always()
        run: |
          echo "=== Recent Commits ==="
          git log --oneline -5 || true
